<!DOCTYPE html>
<html>
<head>
    <title>Guess the Number</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Score Card -->
        <div class="card shadow-sm border-0">

            <div class="card-header bg-dark text-white text-center py-3">
                <h1 class="h3 mb-0">Score Card</h1>
            </div>

            <div class="card-body">

                <div class="text-center mb-3">
                    <button
                        class="btn btn-secondary"
                        data-bs-toggle="collapse"
                        data-bs-target="#score"
                    >
                        Show Score
                    </button>
                </div>

                <section class="collapse" id="score">

                    <div class="row text-center fw-bold bg-primary text-white py-3 mx-0">
                        <div class="col-2">Round No.</div>
                        <div class="col-3">Guessed No.</div>
                        <div class="col-3">Correct No.</div>
                        <div class="col-4">Result</div>
                    </div>

                    <!-- Score rows are added here by JavaScript -->
                    <div id="scoreRows"></div>

                </section>

            </div>
        </div>


        <!-- Guessing Game -->
        <div class="mt-5">

            <section>

                <div class="card shadow-sm border-0">

                    <div class="card-body p-5">

                        <h1 class="display-4 pb-4">
                            Guess the Number
                        </h1>

                        <div class="mb-4">

                            <label
                                for="guess"
                                class="form-label fw-semibold"
                            >
                                Guess the Number between 1 and 10:
                            </label>

                            <input
                                type="number"
                                name="guess"
                                id="guess"
                                placeholder="e.g. 7"
                                class="form-control form-control-lg"
                                min="1"
                                max="10"
                                required
                            >

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary btn-lg rounded-5 w-100"
                            onclick="submitGuess()"
                        >
                            Submit
                        </button>

                        <div
                            id="result"
                            class="alert d-none mt-4 text-center"
                            role="alert"
                        ></div>

                    </div>
                </div>

            </section>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const lowerLimit = 1;
        const upperLimit = 10;

        let roundNumber = 0;


        function getRandomNumber() {

            return Math.floor(
                Math.random() * (upperLimit - lowerLimit + 1)
            ) + lowerLimit;

        }


        function submitGuess() {

            const guessInput = document.getElementById("guess");

            if (!guessInput.value) {

                guessInput.classList.add("is-invalid");

                return;
            }

            guessInput.classList.remove("is-invalid");

            const userGuess = Number(guessInput.value);

            (userGuess >= 1 && userGuess <= 10) ? playRound(userGuess) : window.alert("The guess must be between 1 and 10 (inclusive at both ends)");

            guessInput.value = "";

        }


        function playRound(guess) {

            roundNumber++;

            // A new correct number is generated for every round.
            const correctNumber = getRandomNumber();

            if (guess === correctNumber) {

                userWinCondition();

                addScore(
                    roundNumber,
                    guess,
                    correctNumber,
                    "Correct"
                );

            }
            else {

                userLoseCondition();

                addScore(
                    roundNumber,
                    guess,
                    correctNumber,
                    "Incorrect"
                );

            }

        }


        function userWinCondition() {

            const result = document.getElementById("result");

            result.textContent =
                "🎉 Correct! You guessed the number!";

            result.classList.remove(
                "d-none",
                "alert-danger"
            );

            result.classList.add("alert-success");

        }


        function userLoseCondition() {

            const result = document.getElementById("result");

            result.textContent =
                "❌ Wrong guess! Try again.";

            result.classList.remove(
                "d-none",
                "alert-success"
            );

            result.classList.add("alert-danger");

        }


        function addScore(
            round,
            guess,
            correctNumber,
            result
        ) {

            const scoreRows =
                document.getElementById("scoreRows");

            const row =
                document.createElement("div");

            row.classList.add(
                "row",
                "text-center",
                "align-items-center",
                "border-bottom",
                "py-3",
                "mx-0"
            );


            const resultClass =
                result === "Correct"
                    ? "bg-success"
                    : "bg-danger";


            row.innerHTML = `
                <div class="col-2">
                    ${round}
                </div>

                <div class="col-3">
                    ${guess}
                </div>

                <div class="col-3">
                    ${correctNumber}
                </div>

                <div class="col-4">
                    <span class="badge ${resultClass}">
                        ${result}
                    </span>
                </div>
            `;


            scoreRows.appendChild(row);

        }

    </script>

</body>
</html>

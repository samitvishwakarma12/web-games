<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                Web Games
            </a>
        </div>
    </nav>


    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-5">
                Web Games
            </h1>
            <p class="lead text-muted">
                A collection of small games built for the web.
            </p>
        </div>

        <section>
            <h2 class="h4 mb-4">
                Games
            </h2>

            <div class="row g-4">

                <div class="col-12 col-md-6 col-lg-4">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h3 class="card-title h5">
                                Guess the Number
                            </h3>

                            <p class="card-text text-muted">
                                Try to guess the randomly generated number.
                            </p>

                            <a href="./guess-the-number.html" class="btn btn-primary">
                                Play Game
                            </a>

                        </div>

                    </div>

                </div>

                <div class="col-12 col-md-6 col-lg-4">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h3 class="card-title h5">
                                Rock, Paper, Scissors
                            </h3>

                            <p class="card-text text-muted">
                                Test your luck against the bot in the classic game of Rock, Paper, Scissors.
                            </p>

                            <a href="./rock-paper-scissors.html" class="btn btn-primary">
                                Play Game
                            </a>
                        </div>
                    </div>

                </div>
            </div>

        </section>

    </main>


    <footer class="bg-dark text-white text-center py-3 mt-5">

        <div class="container">
            <small>
                Made by Samit Vishwakarma.
            </small>
        </div>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid p-4">
    <section class="border border-primary rounded text-center p-4 bg-primary">
        <h1 id="round-heading" class="mb-4 text-light">Pick a choice to start the game</h1>

        <div class="row g-4">
            <div class="col">
                <div id="human-card" class="card border border-primary rounded">
                    <div class="card-header h2 py-3 bg-secondary text-white">Human score</div>
                    <div id="human-score" class="card-body display-3 py-4">0</div>
                </div>
            </div>

            <div class="col">
                <div id="bot-card" class="card border border-primary rounded">
                    <div class="card-header h2 py-3 bg-secondary text-white">Bot score</div>
                    <div id="bot-score" class="card-body display-3 py-4">0</div>
                </div>
            </div>
        </div>

        <span id="result-badge" class="badge text-bg-success fs-5 mt-3 d-none">Result</span>
    </section>

    <section id="choice-section" class="text-center p-4">
        <h2 class="mb-4">Pick your choice</h2>

        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-primary" onclick="rock()">Rock</button>
            <button class="btn btn-primary" onclick="paper()">Paper</button>
            <button class="btn btn-primary" onclick="scissors()">Scissors</button>
        </div>
    </section>

    <section id="reset-section" class="text-center p-4 d-none">
        <button class="btn btn-light border border-warning" onclick="reset()">Reset</button>
    </section>

    <section class="text-center p-4">
        <h2>
            <button class="btn btn-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#settings">
                Settings
            </button>
        </h2>

        <div class="collapse" id="settings">
            <div class="p-3">
                <label for="rounds-input" class="form-label">Number of rounds</label>
                <input type="number" id="rounds-input" class="form-control" value="5">

                <button class="btn btn-primary mt-3" onclick="update_rounds()">
                    Apply
                </button>
            </div>
        </div>
    </section>
</div>

<script>
    let no_of_rounds = 5;
    let current_round = 0;

    function rock() {
        play_turn("Rock");
    }

    function paper() {
        play_turn("Paper");
    }

    function scissors() {
        play_turn("Scissors");
    }

    function play_bot_choice() {
        const choices = ["Rock", "Paper", "Scissors"];
        return choices[Math.floor(Math.random() * choices.length)];
    }

    function increment_human_score() {
        const score = document.getElementById("human-score");
        score.textContent = parseInt(score.textContent) + 1;
    }

    function increment_bot_score() {
        const score = document.getElementById("bot-score");
        score.textContent = parseInt(score.textContent) + 1;
    }

    function show_result(result) {
        const badge = document.getElementById("result-badge");

        badge.classList.remove("d-none", "text-bg-success", "text-bg-danger", "text-bg-secondary");

        if (result === "Human") {
            badge.textContent = "Human wins this turn";
            badge.classList.add("text-bg-success");
        } else if (result === "Bot") {
            badge.textContent = "Bot wins this turn";
            badge.classList.add("text-bg-danger");
        } else {
            badge.textContent = "Tie this turn";
            badge.classList.add("text-bg-secondary");
        }
    }

    function update_round() {
        const heading = document.getElementById("round-heading");
        const human_card = document.getElementById("human-card");
        const bot_card = document.getElementById("bot-card");
        const human_score = parseInt(document.getElementById("human-score").textContent);
        const bot_score = parseInt(document.getElementById("bot-score").textContent);

        if (current_round === 0) {
            heading.textContent = "Pick a choice to start the game";
        } else if (current_round < no_of_rounds) {
            heading.textContent = `Round ${current_round}`;
        } else {
            if (human_score > bot_score) {
                heading.textContent = "Human wins the game.";
                human_card.classList.add("bg-success");
                bot_card.classList.add("bg-danger");
            } else if (bot_score > human_score) {
                heading.textContent = "Bot wins the game.";
                bot_card.classList.add("bg-success");
                human_card.classList.add("bg-danger");
            }

            document.getElementById("choice-section").classList.add("d-none");
            document.getElementById("reset-section").classList.remove("d-none");
        }
    }

    function play_turn(human_choice) {
        if (current_round >= no_of_rounds) {
            return;
        }

        const bot_choice = play_bot_choice();

        if (human_choice === bot_choice) {
            show_result("Tie");
        } else if (
            (human_choice === "Rock" && bot_choice === "Scissors") ||
            (human_choice === "Paper" && bot_choice === "Rock") ||
            (human_choice === "Scissors" && bot_choice === "Paper")
        ) {
            increment_human_score();
            show_result("Human");
        } else {
            increment_bot_score();
            show_result("Bot");
        }

        current_round++;
        update_round();
    }

    function reset() {
        current_round = 0;

        document.getElementById("human-score").textContent = "0";
        document.getElementById("bot-score").textContent = "0";

        document.getElementById("human-card").classList.remove("bg-success", "bg-danger");
        document.getElementById("bot-card").classList.remove("bg-success", "bg-danger");

        document.getElementById("result-badge").classList.add("d-none");

        document.getElementById("choice-section").classList.remove("d-none");
        document.getElementById("reset-section").classList.add("d-none");

        update_round();
    }

    function update_rounds() {
        no_of_rounds = parseInt(document.getElementById("rounds-input").value);
    }

    update_round();
</script>

</body>
</html>
